<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in | ReStore Delivery</title>
    <link rel="stylesheet" href="./styles/login.css">
</head>

<body>
    <header class="nav">
        <a class="brand" href="index.html">Habitat for Humanity <span>Pick Up & Delivery</span></a>
        <nav class="nav-actions" aria-label="Account">
            <a class="btn btn-outline" href="login.html">Login</a>
            <a class="btn btn-orange" href="register.html">Register</a>
        </nav>
    </header>
    <main>
        <section class="card">
            <h1>Log in</h1>
            <p class="sub">Customers and drivers log in here.</p>
            <form action="#" method="post">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" required>
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <a class="forgot" href="#">Forgot your password?</a>
                <button class="btn btn-orange submit" type="submit">Log in</button>
            </form>
            <p class="alt">New here? <a href="register.html">Create an account</a></p>
        </section>
    </main>
</body>

</html>
